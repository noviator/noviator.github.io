<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naveen S – Coordinated Vulnerability Disclosure</title>
    <meta name="description" content="Security research and coordinated vulnerability disclosure by Naveen S. Contact: security@naveen-research.com">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #14110c;
            color: #eedfc2;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            width: 100%;
            max-width: 560px;
        }
        .archive-card {
            border: 1px solid rgba(238, 223, 194, 0.42);
            background-color: #1c1812;
            padding: 56px;
            position: relative;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        }
        h1 {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 14px;
            color: #8a7b63;
            margin-bottom: 34px;
        }
        .body-text {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 36px;
            border-top: 1px dashed #eedfc2;
            border-bottom: 1px dashed #eedfc2;
            padding: 20px 0;
        }
        .contact-channel {
            font-size: 15px;
            margin-bottom: 32px;
        }
        .contact-channel a {
            color: #eedfc2;
            font-weight: bold;
            text-decoration: underline;
        }
        .contact-channel a:hover {
            color: #ff6b6b;
        }
        .alt-email {
            font-size: 13px;
            color: #8a7b63;
            margin-top: 10px;
        }
        .alt-email-val {
            color: #eedfc2;
        }
        .linkedin-link {
            display: inline-block;
            text-align: center;
            padding: 8px 16px;
            border: 1px solid #eedfc2;
            color: #eedfc2;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .linkedin-link:hover {
            background-color: #eedfc2;
            color: #1c1812;
        }
        footer {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            font-size: 11px;
            color: #8a7b63;
        }
        @media (max-width: 480px) {
            .archive-card { padding: 40px 24px; }
            h1 { font-size: 30px; }
            .body-text { font-size: 15px; }
            footer { flex-direction: column; gap: 8px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <main class="archive-card">
            <h1>Naveen S</h1>
            <div class="subtitle">Security Research &amp; Disclosure</div>
            <p class="body-text">This domain is used for security research and coordinated vulnerability disclosure.</p>
            <div class="contact-channel">
                <span>Contact: </span>
                <a href="mailto:security@naveen-research.com">security@naveen-research.com</a>
                <div class="alt-email">alt email: <span class="alt-email-val">naveenyes2003@gmail.com</span></div>
            </div>
            <a href="https://www.linkedin.com/in/naveens72/" class="linkedin-link">LinkedIn</a>
        </main>
        <footer>
            <span>naveen-research.com</span>
            <span>For PSIRT / security response only</span>
        </footer>
    </div>
</body>
</html>
